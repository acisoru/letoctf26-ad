services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smcadmin
      POSTGRES_DB: smcdb
      POSTGRES_PASSWORD: jNEqMMLtjiprDSOpsRpSQ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smcadmin -d smcdb"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - smcnet
  smc:
    build: .
    command: gunicorn -w 6 --bind 0.0.0.0:1337 --log-level debug run:app
    restart: unless-stopped
    environment:
      POSTGRES_CONNECT: postgres://smcadmin:jNEqMMLtjiprDSOpsRpSQ@postgres:5432/smcdb
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smcnet
networks:
  smcnet: {}
