services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: tuzemun
      POSTGRES_PASSWORD: PJwPl8v6YlQ87Qzd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tuzemun"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - tuzemun
  tuzemun:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_DBNAME: tuzemun
      POSTGRES_PASS: PJwPl8v6YlQ87Qzd
    ports:
      - '8137:8137'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tuzemun

networks:
  tuzemun: {}
